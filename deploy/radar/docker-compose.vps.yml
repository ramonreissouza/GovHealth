# deploy/radar/docker-compose.vps.yml — a pilha do Radar numa VPS.
#
# ── DUAS TOPOLOGIAS, escolha pelo perfil ─────────────────────────────────────
#
# A) VPS COMPARTILHADA com o app (é o caso de govhealth.techealth.com.br). O nginx
#    do SISTEMA já tem as portas 80/443 e passa a servir também o `radar.*`:
#
#      docker compose -f deploy/radar/docker-compose.vps.yml up -d --build
#
#    Sobem só steel + browser-service; o serviço fica em 127.0.0.1:3200 e quem
#    termina o TLS é o host, com o site deploy/app/nginx/radar.conf.
#
# B) VPS DEDICADA ao Radar, sem nginx de sistema. Aí o compose traz o seu próprio
#    nginx com TLS e renovação automática:
#
#      docker compose -f deploy/radar/docker-compose.vps.yml --profile nginx-proprio up -d --build
#
#    Sem o `--profile`, nginx e certbot não sobem — de propósito: na topologia (A)
#    eles colidiriam com o nginx do host em "address already in use".
#
# Diferença para o docker-compose.radar.yml da raiz (que é o de desenvolvimento, na
# máquina do operador): aqui o steel NÃO publica porta nenhuma, entra um nginx com TLS
# e o browser-service vira imagem, em vez de processo solto no host. Com hostname fixo
# e certificado, o túnel deixa de existir — e some junto a armadilha de ele sortear um
# endereço novo a cada reinício, que é o que derrubou o login em 14/09/2026.

name: radar

services:
  # ── O navegador. Nunca exposto. ─────────────────────────────────────────────
  steel:
    image: ghcr.io/steel-dev/steel-browser:latest
    container_name: radar-steel
    restart: unless-stopped
    networks: [interna]
    # SEM `ports:`. De propósito, e é a linha mais importante deste arquivo.
    #
    # O live view do steel é, por desenho dele, sem autenticação nenhuma, numa rota
    # fixa e sem id. Publicar a porta — mesmo "só para o nginx" — poria na internet
    # uma URL que DIRIGE um navegador logado no gov.br de um cliente. Pior: o Docker
    # escreve a regra direto no iptables e PASSA POR CIMA do firewall da nuvem, então
    # um `ufw deny` não salvaria. Sem `ports`, ele só existe dentro da rede `interna`.
    environment:
      - NODE_ENV=production
    # O Chromium usa memória compartilhada para renderizar; o padrão do Docker é 64MB
    # e ele morre em páginas pesadas — o gov.br é pesada. A aba branca que o fornecedor
    # veria não diria "faltou /dev/shm" em lugar nenhum.
    shm_size: 1gb
    # Um navegador com vazamento não pode levar a instância junto.
    mem_limit: 2g

  # ── O serviço que fala com o steel e guarda a sessão cifrada ────────────────
  browser-service:
    build:
      # Contexto = raiz do repo: o serviço vive em scripts/radar.
      context: ../..
      dockerfile: deploy/radar/Dockerfile
    image: govhealth/radar-browser-service:1
    container_name: radar-browser-service
    restart: unless-stopped
    networks: [interna]
    depends_on: [steel]
    # Só é usada na topologia "nginx do host" (ver o cabeçalho deste arquivo). Com o
    # nginx do compose (perfil `nginx-proprio`) esta linha é inofensiva mas inútil:
    # lá quem alcança o serviço é o container vizinho, pela rede `interna`.
    #
    # O PREFIXO `127.0.0.1:` NÃO É ENFEITE. Escrito como "3200:3200", o Docker
    # publicaria em 0.0.0.0 e escreveria a regra direto no iptables, PASSANDO POR
    # CIMA do firewall da nuvem — um `ufw deny 3200` não salvaria. A porta ficaria
    # na internet, e quem fala com ela cria sessão de navegador e lê o live view.
    # É a mesma armadilha documentada no `steel` acima, só que aqui precisamos de
    # uma porta: então ela existe, mas apenas para a loopback da própria VPS.
    ports:
      - '127.0.0.1:3200:3200'
    # DATABASE_URL, RADAR_CRED_KEY, RADAR_CONNECT_TOKEN e RADAR_PUBLIC_URL vêm daqui.
    # O serviço recusa subir sem os três primeiros (exit 1), o que é o comportamento
    # certo: melhor não subir do que subir sem cofre.
    env_file: [.env]
    environment:
      # Nomes de serviço da rede interna, não localhost. A porta é a INTERNA do steel
      # (3000), não a 3100 do desenvolvimento — aquela era só o mapeamento para o host.
      - RADAR_STEEL_URL=http://steel:3000
      - RADAR_STEEL_CDP=http://steel:9223
      - RADAR_CONNECT_PORT=3200
    mem_limit: 512m

  # ── A porta de entrada: TLS, WebSocket e lista de rotas permitidas ──────────
  #
  # SÓ SOBEM COM O PERFIL `nginx-proprio`, e isso é deliberado:
  #
  #   docker compose -f deploy/radar/docker-compose.vps.yml --profile nginx-proprio up -d
  #
  # Estes dois publicam 80 e 443 NO HOST. Na VPS onde o app já roda, essas portas
  # são do nginx do sistema (que serve govhealth.techealth.com.br e o tecsuply) —
  # os containers simplesmente não sobem, com "address already in use". Por isso o
  # padrão passou a ser NÃO subi-los: quem termina o TLS é o nginx do host, com o
  # site deploy/app/nginx/radar.conf, que repassa para 127.0.0.1:3200.
  #
  # O perfil continua aqui porque a outra topologia é legítima: numa VPS dedicada
  # só ao Radar, sem nginx de sistema, este par é a forma mais simples de ter TLS
  # e renovação automática sem instalar nada no host.
  nginx:
    profiles: ['nginx-proprio']
    image: nginx:1.27-alpine
    container_name: radar-nginx
    restart: unless-stopped
    networks: [interna]
    depends_on: [browser-service]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/radar.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # Recarrega a configuração de tempos em tempos para pegar certificado renovado sem
    # derrubar conexão: um `docker restart` no meio de um login mataria o iframe.
    command: >
      sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # ── Renovação do certificado ────────────────────────────────────────────────
  certbot:
    # Mesmo perfil do nginx: sem o nginx do compose não há webroot para o desafio.
    # Na topologia do nginx do host quem renova é o certbot DO HOST, o mesmo que já
    # renova govhealth.techealth.com.br.
    profiles: ['nginx-proprio']
    image: certbot/certbot:latest
    container_name: radar-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  interna:
    driver: bridge
