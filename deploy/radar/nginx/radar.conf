# deploy/radar/nginx/radar.conf — a única porta de entrada do Radar na VPS.
#
# Troque radar.EXEMPLO.com.br pelo seu hostname (3 ocorrências) e a origem do app em
# frame-ancestors, se ela mudar.
#
# ── O QUE ESTE ARQUIVO PROTEGE ───────────────────────────────────────────────
# O steel não aparece aqui, e isso é a decisão de segurança central. O live view dele
# é, por desenho, "intentionally unauthenticated for fast embeds", numa rota FIXA e
# sem id: quem alcançar a porta dele DIRIGE um navegador logado no gov.br de um
# cliente. No compose o steel não publica porta nenhuma e vive só na rede interna;
# aqui ele não tem `proxy_pass`. Quem vai à internet é o browser-service, que serve o
# live view em /live/<token> com porteiro próprio.

# O LIMITE DE VERDADE NÃO É ESTE. /session, /capture e /cancel são chamados pelo
# servidor do Next, não pelo navegador do fornecedor: por IP, todo tenant chega com o IP
# de saída da Vercel e dividiria UM balde — um usuário insistente travava a captura e o
# cancelamento dos outros (revisão da #35). O limite por conexão e por rota mora no
# browser-service (scripts/radar/limite-credencial.mjs), que sabe qual credencial pediu.
# Este aqui é só um TETO LARGO por IP, contra quem martela de fora — com o token interno
# exigido, ninguém de fora passa do 401 de qualquer jeito.
limit_req_zone $binary_remote_addr zone=radar_app:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=radar_live:10m   rate=120r/m;

# O WebSocket do player: sem repassar o upgrade, o iframe carrega o HTML e fica
# parado em "Session not connected" — que parece "quase funcionando", o pior jeito de
# falhar. O `map` deixa o cabeçalho Connection correto em conexão normal e em upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name radar.EXEMPLO.com.br;

    # O desafio do Let's Encrypt precisa continuar em http puro.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name radar.EXEMPLO.com.br;

    ssl_certificate     /etc/letsencrypt/live/radar.EXEMPLO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.EXEMPLO.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTPS não é conforto aqui: a CSP da aplicação manda `upgrade-insecure-requests`,
    # então um http puro seria reescrito para https e o iframe não carregaria. E o
    # player só fala `wss:` quando RADAR_PUBLIC_URL é https.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    # QUEM PODE EMBUTIR ESTA PÁGINA — e só quem.
    #
    # Repare que NÃO há `X-Frame-Options`. A tentação de pôr DENY/SAMEORIGIN mataria o
    # produto: o live view existe para ser embutido pela aplicação. O controle certo é
    # `frame-ancestors`, que nomeia a origem permitida em vez de proibir todas. Sem
    # isto, qualquer site poderia embutir a tela de login do gov.br do seu cliente e
    # capturar o que ele digita por cima (clickjacking).
    add_header Content-Security-Policy "frame-ancestors https://gov-health.vercel.app" always;

    # Os corpos são JSON minúsculos ({"credencialId":"..."}); nada legítimo chega perto
    # disto. Fechar aqui é de graça.
    client_max_body_size 16k;

    # ── O live view: única rota aberta ao navegador do fornecedor ────────────
    # Ela NÃO exige o token interno do app — quem a abre é o navegador do cliente, que
    # não tem (e não pode ter) esse segredo. A autorização é o token de 32 bytes na
    # própria URL, que o serviço confere e mata no cancelar/capturar.
    location /live/ {
        limit_req zone=radar_live burst=60 nodelay;

        proxy_pass http://browser-service:3200;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O buffer do nginx atrapalha duas coisas aqui: o streaming do player e o
        # websocket. E os tempos precisam ser LONGOS — do outro lado há uma pessoa
        # digitando CPF, senha e 2FA, com o 2FA às vezes esperando SMS. O padrão de
        # 60s cortaria o login no meio, e o cliente veria a tela congelar sem erro.
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── As três rotas do app: exigem x-radar-token, que o nginx só repassa ───
    # Quem chama é o servidor da Vercel, não o navegador de ninguém. O token nunca
    # chega ao cliente: a rota /api/radar/conexao do Next é que o injeta.
    location = /session {
        # Teto largo por IP (ver a zona). O limite por conexão é do browser-service.
        limit_req zone=radar_app burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @radar_limite;
        proxy_pass http://browser-service:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A captura conecta por CDP e lê o estado do navegador; não é instantânea.
        proxy_read_timeout 120s;
    }

    location = /capture {
        limit_req zone=radar_app burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @radar_limite;
        proxy_pass http://browser-service:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /cancel {
        limit_req zone=radar_app burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @radar_limite;
        proxy_pass http://browser-service:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # O 429 do nginx em JSON, com `error` e `detalhe`. O padrão é 503 em HTML, e o proxy
    # do Next lê HTML como "a ponte com a nossa máquina está fora do ar" — o limite
    # aparecia para o fornecedor como pane do serviço.
    location @radar_limite {
        default_type application/json;
        return 429 '{"erro":"Muitas requisições ao serviço de conexão. Aguarde um minuto e tente de novo.","error":"Muitas requisições ao serviço de conexão. Aguarde um minuto e tente de novo.","detalhe":"Muitas requisições ao serviço de conexão. Aguarde um minuto e tente de novo.","codigo":"limite_nginx"}';
    }

    # Tudo o mais morre aqui, no nginx, sem chegar ao serviço. O browser-service já
    # recusaria, mas uma lista de rotas permitidas é o que impede que uma rota nova
    # criada amanhã fique pública sem ninguém decidir isso.
    location / {
        return 404;
    }
}
