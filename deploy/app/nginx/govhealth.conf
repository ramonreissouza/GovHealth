# deploy/app/nginx/govhealth.conf — site do nginx DO SISTEMA (não roda em
# container, ao contrário de deploy/radar/nginx/radar.conf).
#
# Esta VPS é compartilhada com outro projeto (tecsuply) e a porta 80/443 já é do
# nginx do host (`systemctl status nginx`), que serve os dois por `server_name`.
# Ver /etc/nginx/sites-enabled/tecsupply.conf nesta mesma VPS para o padrão de
# origem — este arquivo replica a mesma estrutura.
#
# ── COMO LIGAR (na VPS, não aqui) ─────────────────────────────────────────────
#   sudo cp deploy/app/nginx/govhealth.conf /etc/nginx/sites-available/govhealth.conf
#   sudo ln -s /etc/nginx/sites-available/govhealth.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d govhealth.techealth.com.br
#
# O certbot REESCREVE este arquivo sozinho depois desse último comando: acrescenta
# o bloco `listen 443 ssl` com os caminhos do certificado e cria um segundo
# `server {}` que redireciona 80→443 (mesma coisa que ele já fez em tecsupply.conf
# e observability.conf nesta VPS — procure os comentários "# managed by Certbot").
# Não copie essa versão final de volta para o repositório: os caminhos do
# certificado são artefato da VPS, não código.
#
# DNS de govhealth.techealth.com.br precisa já apontar para o IP desta VPS ANTES
# do certbot rodar — o desafio HTTP-01 dele bate nessa porta 80 vindo da internet.

server {
    server_name govhealth.techealth.com.br;

    listen 80;
    listen [::]:80;

    # Cobre upload de documento/planilha; ajuste se algum fluxo precisar de mais.
    client_max_body_size 20m;

    location / {
        # 3001, não 3000: nesta VPS a 3000 já é do tecsuply-app-1 (outro projeto).
        # Ver a porta publicada em deploy/app/docker-compose.yml (serviço `app`).
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Respostas em streaming (Copiloto de IA) saem em pedaços; bufferizar
        # atrasaria cada chunk até o nginx acumular um bloco inteiro.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
