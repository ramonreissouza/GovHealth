# deploy/app/nginx/radar.conf — site do nginx DO SISTEMA para o Radar.
#
# Irmão de govhealth.conf: mesma VPS, mesmo nginx de host, outro `server_name`.
# Existe porque nesta VPS as portas 80/443 já são do nginx do sistema (app +
# tecsuply), então o nginx que vem no compose do Radar não tem onde subir — ele
# ficou atrás do perfil `nginx-proprio`, para o caso de uma VPS dedicada.
#
# Este arquivo é a PORTA DE ENTRADA do Radar. Ele é uma adaptação de
# deploy/radar/nginx/radar.conf; as decisões de segurança de lá foram mantidas
# uma a uma, e estão comentadas abaixo. Só mudou o destino do proxy: em vez do
# nome de serviço do compose (`browser-service:3200`), aqui é `127.0.0.1:3200`,
# porque o nginx do host não enxerga a rede interna do Docker.
#
# ── COMO LIGAR (na VPS, não aqui) ─────────────────────────────────────────────
#   sudo cp deploy/app/nginx/radar.conf /etc/nginx/sites-available/radar.conf
#   sudo ln -s /etc/nginx/sites-available/radar.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d radar.govhealth.techealth.com.br
#
# O certbot reescreve este arquivo sozinho: acrescenta `listen 443 ssl` com os
# caminhos do certificado e cria um segundo `server {}` de 80→443. Os cabeçalhos
# e as rotas abaixo sobrevivem à reescrita. Não copie a versão final de volta
# para o repositório — os caminhos do certificado são artefato da VPS.
#
# O DNS de radar.govhealth.techealth.com.br precisa apontar para o IP desta VPS
# ANTES do certbot rodar: o desafio HTTP-01 dele bate nesta porta 80 vindo da
# internet. Hoje esse nome NÃO resolve (conferido em 21/09/2026).
#
# ── O QUE ESTE ARQUIVO PROTEGE ───────────────────────────────────────────────
# O steel não aparece aqui, e essa é a decisão central. O live view dele é, por
# desenho, sem autenticação nenhuma, numa rota fixa e sem id: quem alcançar a
# porta dele DIRIGE um navegador logado no gov.br de um cliente. No compose ele
# não publica porta e vive só na rede interna. Quem vai à internet é o
# browser-service, que serve o live view em /live/<token> com porteiro próprio.

limit_req_zone $binary_remote_addr zone=radar_sessao:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=radar_live:10m   rate=120r/m;

# O WebSocket do player: sem repassar o upgrade, o iframe carrega o HTML e fica
# parado em "Session not connected" — que parece "quase funcionando", o pior jeito
# de falhar.
#
# O nome da variável é `radar_connection_upgrade`, e não o `connection_upgrade`
# habitual, de propósito: este arquivo divide o contexto `http` com os outros
# sites de /etc/nginx/sites-enabled. Se qualquer um deles já definir um `map`
# para `$connection_upgrade`, o nginx recusa a configuração inteira com
# "duplicate map" e o HOST FICA SEM NGINX — derrubando junto o app e o tecsuply.
map $http_upgrade $radar_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name radar.govhealth.techealth.com.br;

    listen 80;
    listen [::]:80;

    # HTTPS não é conforto aqui: a CSP da aplicação manda `upgrade-insecure-requests`,
    # então um http puro seria reescrito para https e o iframe não carregaria. E o
    # player só fala `wss:` quando RADAR_PUBLIC_URL é https. Estes cabeçalhos passam
    # a valer quando o certbot converter este bloco para 443.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;

    # QUEM PODE EMBUTIR ESTA PÁGINA — e só quem.
    #
    # Repare que NÃO há `X-Frame-Options`. A tentação de pôr DENY/SAMEORIGIN mataria
    # o produto: o live view existe para ser embutido pela aplicação. O controle certo
    # é `frame-ancestors`, que nomeia a origem permitida em vez de proibir todas. Sem
    # isto, qualquer site poderia embutir a tela de login do gov.br do seu cliente e
    # capturar o que ele digita por cima (clickjacking).
    #
    # São DUAS origens porque hoje o app tem duas frentes: a VPS e a Vercel. Apague a
    # da Vercel assim que ela deixar de servir clientes — cada origem a mais aqui é
    # uma a mais que pode embutir a tela de login.
    add_header Content-Security-Policy "frame-ancestors https://govhealth.techealth.com.br https://gov-health.vercel.app" always;

    # Os corpos são JSON minúsculos ({"credencialId":"..."}); nada legítimo chega
    # perto disto. Fechar aqui é de graça.
    client_max_body_size 16k;

    # ── O live view: única rota aberta ao navegador do fornecedor ────────────
    # Ela NÃO exige o token interno do app — quem a abre é o navegador do cliente,
    # que não tem (e não pode ter) esse segredo. A autorização é o token de 32 bytes
    # na própria URL, que o serviço confere e mata no cancelar/capturar.
    location /live/ {
        limit_req zone=radar_live burst=60 nodelay;

        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $radar_connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O buffer do nginx atrapalha duas coisas aqui: o streaming do player e o
        # websocket. E os tempos precisam ser LONGOS — do outro lado há uma pessoa
        # digitando CPF, senha e 2FA, com o 2FA às vezes esperando SMS. O padrão de
        # 60s cortaria o login no meio, e o cliente veria a tela congelar sem erro.
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── As três rotas do app: exigem x-radar-token, que o nginx só repassa ───
    # Quem chama é o servidor do Next, não o navegador de ninguém. O token nunca
    # chega ao cliente: a rota /api/radar/conexao é que o injeta.
    location = /session {
        # Cada chamada AQUI abre um navegador de verdade. 6/min com rajada de 3 é
        # muito mais do que o uso real (um fornecedor conecta uma vez) e continua
        # barato para nós.
        limit_req zone=radar_sessao burst=3 nodelay;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A captura conecta por CDP e lê o estado do navegador; não é instantânea.
        proxy_read_timeout 120s;
    }

    location = /capture {
        limit_req zone=radar_sessao burst=3 nodelay;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /cancel {
        limit_req zone=radar_sessao burst=3 nodelay;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Tudo o mais morre aqui, no nginx, sem chegar ao serviço. O browser-service já
    # recusaria, mas uma lista de rotas permitidas é o que impede que uma rota nova
    # criada amanhã fique pública sem ninguém decidir isso.
    location / {
        return 404;
    }
}
