# deploy/app/docker-compose.yml — Postgres + aplicação + worker na VPS.
#
# SEGREDOS NÃO VÊM DE `.env` NESTA PASTA — vêm do ambiente do shell, no mesmo
# padrão do outro projeto desta VPS (tecsuply, ~/tecsupply-secrets.env):
#
#   source ~/govhealth-secrets.env      # export KEY=valor, um por linha
#   cd ~/govhealth/deploy/app
#   docker compose up -d db                      # 1. sobe só o banco
#   docker compose --profile restore run --rm restore   # 2. restaura o dump
#   docker compose build app worker              # 3. constrói
#   docker compose up -d --wait --wait-timeout 120 app worker   # 4. sobe
#
# `deploy/app/.env.exemplo` continua sendo a lista canônica de variáveis (com o
# porquê de cada uma) — só troque `KEY=valor` por `export KEY=valor` ao montar o
# `~/govhealth-secrets.env`. Nada com `export` pode se chamar `.env` dentro do
# repositório: esse nome é lido automaticamente pelo próprio `docker compose`
# (não em formato de shell) e o `.gitignore` trata `.env` como segredo — dois
# motivos para não reaproveitar o nome.
#
# SEM nginx nem certbot aqui dentro — esta VPS é COMPARTILHADA (tem outro projeto
# rodando junto, tecsuply) e a porta 80/443 já é do nginx DO SISTEMA
# (`systemctl status nginx`), gerenciado fora do Docker, com certbot no modo
# `--nginx` (`/etc/nginx/sites-available/`). Ver deploy/app/nginx/govhealth.conf
# para o arquivo de site e o passo a passo de como ligá-lo.
#
# `worker` é quem agenda os 4 jobs que antes eram crons da Vercel (sync-pncp,
# sync-emendas, alertas-email, trial-reminders) via pg-boss — ver src/worker/index.ts.
# Suba-o só DEPOIS de desativar os crons na Vercel, para não rodar em duplicidade.
#
# O Postgres NÃO é publicado na internet: `127.0.0.1:5432` só aceita conexão da
# própria VPS. A app fala com ele pela rede interna do compose (`db:5432`), e quem
# precisar de acesso remoto usa túnel SSH — `ssh -L 5432:127.0.0.1:5432 vps`. É o
# mesmo desenho da VM atual, onde o Postgres escuta em 127.0.0.1 e só o PgBouncer
# se expõe, com TLS.

name: govhealth

# Uma chave sem valor (ou `null`) faz o compose repassar a variável de mesmo nome
# do AMBIENTE DO SHELL para o container — é o que liga isto ao `source` acima.
# Âncora YAML (`x-` é ignorado pelo schema do compose) para não repetir a mesma
# lista em `app` e `worker`.
x-app-env: &app-env
  SITE_URL:
  NEXT_PUBLIC_APP_URL:
  NEXT_PUBLIC_CONTATO_EMAIL:
  NEXTAUTH_SECRET:
  NEXTAUTH_URL:
  GOOGLE_CLIENT_ID:
  GOOGLE_CLIENT_SECRET:
  AUTH_SESSAO_UNICA:
  RADAR_CRED_KEY:
  RADAR_CONNECT_URL:
  RADAR_CONNECT_TOKEN:
  RADAR_EMBED_ORIGIN:
  RADAR_COMPRASGOV_ENABLED:
  RADAR_COMPRASGOV_AMBIENTE:
  RADAR_COMPRASGOV_INTERVAL_SECONDS:
  RADAR_COMPRASGOV_MAX_REQUESTS:
  RADAR_PUBLICO_INTERVAL_SECONDS:
  SERPRO_CONSUMER_KEY:
  SERPRO_CONSUMER_SECRET:
  CRON_SECRET:
  RESEND_API_KEY:
  RESEND_FROM_EMAIL:
  ZAI_API_KEY:
  ZAI_BASE_URL:
  ZAI_MODEL:
  NEXT_PUBLIC_IA_HABILITADA:
  STRIPE_SECRET_KEY:
  STRIPE_WEBHOOK_SECRET:
  STRIPE_PRICE_ESSENCIAL:
  STRIPE_PRICE_PRO:
  STRIPE_PRICE_EMPRESA:
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:
  PORTAL_TRANSPARENCIA_API_KEY:
  SERASA_API_KEY:
  SERASA_API_URL:
  UPSTASH_REDIS_REST_URL:
  UPSTASH_REDIS_REST_TOKEN:
  # Achadas auditando process.env.* em src/ direto (não estavam no .env.exemplo
  # antigo) — todas com fallback seguro no código, ver deploy/app/.env.exemplo.
  ADMIN_EMAIL:
  AUTH_2FA:
  JIRA_BASE_URL:
  JIRA_EMAIL:
  JIRA_API_TOKEN:
  JIRA_PROJECT_KEY:
  JIRA_ISSUE_TYPE:
  PNCP_BASE_URL:
  PNCP_API_BASE:
  CNES_BASE_URL:
  COMPRASGOV_DADOS_ABERTOS_BASE:

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em ~/govhealth-secrets.env e dê source}
      POSTGRES_DB: ${POSTGRES_DB:-govhealth}
      # UTC explícito. O banco de origem roda em Etc/UTC e a máquina de
      # desenvolvimento não — já houve dia da semana lido errado por causa disso.
      TZ: UTC
      PGTZ: UTC
    volumes:
      # ATENÇÃO: `/var/lib/postgresql`, NÃO `/var/lib/postgresql/data`. A imagem 18
      # mudou a convenção — os dados passam a ficar numa subpasta com o número da
      # major, para permitir `pg_upgrade --link` sem cruzar fronteira de mount. Com o
      # caminho antigo o container sobe, escreve no lugar errado e morre no
      # healthcheck com um aviso de 30 linhas que não diz "corrija o volume".
      - pgdata:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      # `pg_isready` sem -U responde pelo usuário do SO; com -U confere o papel certo.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-govhealth} -d ${POSTGRES_DB:-govhealth}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Restauração do dump. Só roda quando chamado com --profile restore, para não
  # correr risco de ser executado por engano num `up` e passar por cima do banco.
  #
  #   docker compose --profile restore run --rm restore
  #
  # `--no-owner --no-privileges` porque o papel de origem pode não existir aqui;
  # `-j 2` porque a VPS não precisa de mais paralelismo para 159 MB, e mais jobs em
  # disco compartilhado costuma piorar. Erros de "extension already exists" são
  # esperados e inofensivos — o que importa é a contagem por tabela no fim.
  restore:
    profiles: ['restore']
    image: postgres:18-alpine
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      # DUMP_DIR aponta para a pasta que contém o .dump. O padrão é `./dump`, mas
      # mantenha o arquivo FORA do repositório se puder: são 159 MB com os dados
      # pessoais de todos os clientes e o cofre cifrado do Radar dentro.
      - ${DUMP_DIR:-./dump}:/dump:ro
    entrypoint: ['sh', '-c']
    command:
      - |
        set -e
        arq=$${DUMP:-/dump/govhealth-migracao.dump}
        echo ">> restaurando $$arq"
        pg_restore -h db -U "$${POSTGRES_USER:-govhealth}" -d "$${POSTGRES_DB:-govhealth}" \
          -j 2 --no-owner --no-privileges "$$arq" || echo ">> pg_restore terminou com avisos (veja acima)"
        echo ">> ANALYZE"
        psql -h db -U "$${POSTGRES_USER:-govhealth}" -d "$${POSTGRES_DB:-govhealth}" -c 'ANALYZE;'
        echo ">> contagem por tabela (compare com contagem-origem.txt)"
        psql -h db -U "$${POSTGRES_USER:-govhealth}" -d "$${POSTGRES_DB:-govhealth}" -Atc \
          "select table_name||' '||(xpath('/row/c/text()', query_to_xml('select count(*) c from public.'||quote_ident(table_name), false, true, '')))[1]::text::bigint from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by table_name;"

  app:
    build:
      # O contexto é a raiz do repositório; o .dockerignore que vale é o
      # deploy/app/Dockerfile.dockerignore (ver o cabeçalho do Dockerfile).
      context: ../..
      dockerfile: deploy/app/Dockerfile
      # EXPLÍCITO, não confiar no "último stage do Dockerfile" — o `worker` foi
      # acrescentado DEPOIS do `runner`, e sem `target:` o build cai por padrão
      # no último stage do arquivo. Sem esta linha, `app` builda o `worker` calado:
      # a imagem sobe (build "funciona"), só não tem `.next/standalone` nem
      # `server.js` dentro. Medido: as duas imagens saíam idênticas.
      target: runner
      args:
        # LIDOS EM TEMPO DE BUILD. Mudar em ~/govhealth-secrets.env sem reconstruir
        # a imagem (docker compose build) não tem efeito.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_CONTATO_EMAIL: ${NEXT_PUBLIC_CONTATO_EMAIL}
        NEXT_PUBLIC_IA_HABILITADA: ${NEXT_PUBLIC_IA_HABILITADA}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        RADAR_EMBED_ORIGIN: ${RADAR_EMBED_ORIGIN}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *app-env
      # DATABASE_URL não está na âncora: aqui o host é o nome do serviço (`db`),
      # não o valor que estaria no `~/govhealth-secrets.env` — construído a partir
      # de POSTGRES_USER/PASSWORD/DB, que também vêm do ambiente do shell.
      DATABASE_URL: postgresql://${POSTGRES_USER:-govhealth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-govhealth}
      TZ: UTC
    ports:
      # 3001, NÃO 3000: nesta VPS a porta 3000 já é do `tecsuply-app-1` (outro
      # projeto, outro docker-compose). O container por dentro continua na 3000
      # (é a porta que o Next escuta, fixa no Dockerfile) — só o lado do HOST
      # muda. O nginx do sistema aponta para 127.0.0.1:3001 (ver nginx/govhealth.conf).
      - '127.0.0.1:3001:3000'

  # Substitui os 5 crons da Vercel (vercel.json). Processo de longa duração: faz
  # polling no schema `pgboss` do próprio banco (ver src/worker/index.ts) — não é
  # chamado por HTTP nem depende de cron do sistema. Roda via `tsx` direto, sem
  # passo de build próprio, por isso não recebe `args:` de build-time como a `app`.
  worker:
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-govhealth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-govhealth}
      TZ: America/Sao_Paulo

  radar-comprasgov:
    profiles: ['radar-comprasgov']
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
      target: radar-comprasgov
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-govhealth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-govhealth}
      RADAR_COMPRASGOV_ENABLED:
      RADAR_COMPRASGOV_AMBIENTE:
      RADAR_COMPRASGOV_INTERVAL_SECONDS:
      RADAR_COMPRASGOV_MAX_REQUESTS:
      SERPRO_CONSUMER_KEY:
      SERPRO_CONSUMER_SECRET:
      TZ: UTC

  radar-comprasgov-publico:
    profiles: ['radar-publico']
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
      target: radar-comprasgov-publico
    restart: unless-stopped
    init: true
    shm_size: '256mb'
    stop_grace_period: 30s
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-govhealth}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-govhealth}
      RADAR_PUBLICO_INTERVAL_SECONDS: ${RADAR_PUBLICO_INTERVAL_SECONDS:-300}
      TZ: America/Sao_Paulo

volumes:
  pgdata:
