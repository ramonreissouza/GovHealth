{{- if .Values.backup.enabled }}
{{/* Backup diário do banco. Na VM Oracle, isto era o `/usr/local/bin/pg-backup`
     no cron do postgres (03:15, mantinha 7). No k3s só havia o backup que o
     Jenkins faz antes de uma migration, ou seja, nenhum nos dias sem migration.

     O dump fica no disco da própria VPS. Protege contra erro humano e contra um
     banco corrompido, mas não contra perder a máquina: copiar para fora é o
     próximo passo (docs/vps-mineracao.md, "Backup"). */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-banco
  namespace: {{ .Release.Namespace }}
  annotations:
    {{/* `helm uninstall` não pode levar os backups junto com o resto. */}}
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{/* Classe dinâmica, como a pista da mineração: o PV nasce pelo provisionador
       do k3s, e não pela ServiceAccount do Jenkins, que só LÊ PV. */}}
  storageClassName: {{ .Values.backup.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-banco
  labels: { app: backup }
spec:
  schedule: {{ .Values.backup.agenda | quote }}
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels: { app: backup }
        spec:
          restartPolicy: Never
          priorityClassName: govhealth-prod
          automountServiceAccountToken: false
          securityContext:
            {{/* uid 70 = postgres na imagem alpine. */}}
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
          {{/* Sem esperar o banco, o pg_dump falhava com "Connection refused" no
               primeiro segundo do pod: o controle de rede do k3s só libera o IP de
               um pod novo depois de registrá-lo (medido em 05/10/2026: recusado em
               t+0 s, aceito em t+2 s). As duas tentativas do job nasciam em pods
               novos e caíam no mesmo buraco, então nenhum backup saía. App, worker
               e mineração já esperavam pelo mesmo helper. */}}
          initContainers:
{{ include "govhealth.waitForDb" . | indent 12 }}
          containers:
            - name: pg-dump
              image: {{ .Values.db.image }}
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD }
                - { name: TZ, value: America/Sao_Paulo }
                - { name: MANTER_DIAS, value: {{ .Values.backup.manterDias | quote }} }
              command:
                - sh
                - -c
                - |
                  set -eu
                  cd /backup
                  arq="/backup/govhealth-$(date +%Y-%m-%d_%H%M).dump"

                  # 1) LIMPEZA ANTES DO DUMP (revisão da #62). Se ela viesse depois, um
                  #    volume cheio faria o pg_dump falhar antes de limpar, e todo dia
                  #    seguinte falharia igual, sem nunca liberar espaço.
                  #    A cópia válida mais nova NUNCA sai, mesmo vencida: depois de uma
                  #    semana de falhas, limpar tudo antes de um dump que também pode
                  #    falhar deixaria o banco sem backup nenhum.
                  ultimo=$(ls -1t govhealth-*.dump 2>/dev/null | head -n 1 || true)
                  for f in $(find /backup -maxdepth 1 -name 'govhealth-*.dump' -mtime +"$MANTER_DIAS"); do
                    [ "$(basename "$f")" = "$ultimo" ] && continue
                    echo "vencido: $f"; rm -f "$f"
                  done
                  find /backup -maxdepth 1 -name '*.parcial' -mmin +120 -print -delete
                  find /backup -maxdepth 1 -name '*.invalido' -mtime +"$MANTER_DIAS" -print -delete

                  # 2) ESPAÇO: o dump novo cabe? Exige o dobro do último (o banco cresce
                  #    e a compressão varia), no mínimo 1 GiB. Falta de espaço vira uma
                  #    falha com nome, e não um .parcial truncado.
                  if [ -n "$ultimo" ]; then precisa_kb=$(( $(du -k "$ultimo" | cut -f1) * 2 )); else precisa_kb=0; fi
                  [ "$precisa_kb" -lt 1048576 ] && precisa_kb=1048576
                  livre_kb=$(df -Pk /backup | awk 'NR==2 {print $4}')
                  if [ "$livre_kb" -lt "$precisa_kb" ]; then
                    echo "SEM ESPACO para o backup: livre ${livre_kb} KiB, precisa ${precisa_kb} KiB" >&2
                    ls -lh /backup >&2
                    exit 1
                  fi

                  # 3) Escreve num .parcial, VALIDA o .parcial e só então promove a .dump.
                  #    Nessa ordem: validar depois de renomear deixava um .dump com cara
                  #    de backup bom mesmo quando o pg_restore não o lia (revisão da #51),
                  #    e é o .dump que alguém escolhe na hora de recuperar. Se o pg_dump
                  #    morrer no meio, o .parcial sai na hora, sem esperar 2 h ocupando
                  #    o disco.
                  trap 'rm -f "$arq.parcial"' EXIT
                  pg_dump -h db -U govhealth -d govhealth -Fc -f "$arq.parcial"
                  if ! pg_restore --list "$arq.parcial" > /dev/null; then
                    # Fica para diagnóstico com um nome que ninguém confunde com backup,
                    # e o job falha (aparece em `kubectl get jobs`).
                    mv "$arq.parcial" "$arq.invalido"
                    echo "BACKUP INVALIDO: $arq.invalido não abre no pg_restore" >&2
                    exit 1
                  fi
                  mv "$arq.parcial" "$arq"
                  echo "backup ok: $arq ($(du -h "$arq" | cut -f1)), livre antes: $((livre_kb / 1024)) MiB"
                  ls -lh /backup
              volumeMounts:
                - { name: backup, mountPath: /backup }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: '1', memory: 256Mi }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: backup-banco }
{{- end }}
