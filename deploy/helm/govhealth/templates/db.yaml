apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector: { app: db }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      priorityClassName: govhealth-prod
      automountServiceAccountToken: false
      {{/* O PVC vem de storage.yaml, não de volumeClaimTemplates: o template
           criaria um PVC dinâmico e ignoraria o PV onde o dump foi restaurado. */}}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: govhealth-postgres
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          env:
            - { name: POSTGRES_USER, value: govhealth }
            - { name: POSTGRES_DB, value: govhealth }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD }
            {{/* UTC explícito, como no compose: o banco de origem roda em
                 Etc/UTC, e já houve dia da semana lido errado por causa disso. */}}
            - { name: TZ, value: UTC }
            - { name: PGTZ, value: UTC }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            {{/* `/var/lib/postgresql`, NÃO `/var/lib/postgresql/data`. A imagem
                 18 guarda o dado numa subpasta com o número da major
                 (18/docker), para permitir `pg_upgrade --link` sem cruzar
                 mount. Com o caminho antigo o container sobe, escreve no lugar
                 errado e o dado some no próximo restart. */}}
            - { name: data, mountPath: /var/lib/postgresql }
          readinessProbe:
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, govhealth, -d, govhealth] }
            initialDelaySeconds: 5
            periodSeconds: 5
          {{/* Liveness muito mais tolerante que readiness: um Postgres ocupado
               demais para responder deve sair do balanceamento, não ser morto
               no meio de uma escrita. 30 x 10s = 5 minutos. */}}
          livenessProbe:
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, govhealth, -d, govhealth] }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources: {{ toYaml .Values.db.resources | nindent 12 }}
      terminationGracePeriodSeconds: 120
